<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>BENGS — Interactive App Mockup</title>
<!-- Icons are inline SVG (see ICONS dict in script) — no external font, so this
     file works fully offline and avoids file:// CORS issues with webfonts. -->
<style>
  * { box-sizing: border-box; }
  body { margin:0; font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background:#EDEBE3; color:#0F1330; }
  #layout { display:flex; min-height:100vh; }
  #sidebar { width:260px; background:#fff; border-right:1px solid #D3D1C7; padding:16px 0; overflow-y:auto; height:100vh; position:sticky; top:0; flex-shrink:0; }
  #sidebar h1 { font-size:15px; padding:0 16px 12px; margin:0; }
  #sidebar h1 span { display:block; font-size:10px; color:#888780; font-weight:400; margin-top:2px; }
  .group-label { font-size:10px; text-transform:uppercase; letter-spacing:0.5px; color:#888780; padding:14px 16px 4px; }
  .nav-item { padding:7px 16px; font-size:12px; color:#3B3A36; cursor:pointer; border-left:3px solid transparent; }
  .nav-item:hover { background:#F1EFE8; }
  .nav-item.active { background:#E7ECFF; border-left-color:#1D5BFE; color:#1D5BFE; font-weight:500; }
  #main { flex:1; display:flex; flex-direction:column; align-items:center; padding:32px 24px; }
  #screen-label { font-size:12px; color:#5F5E5A; margin-bottom:14px; text-align:center; }
  #screen-label b { color:#0F1330; }
  #phone-frame { width:320px; border-radius:36px; overflow:hidden; box-shadow:0 12px 40px rgba(0,0,0,0.18); background:#fff; }
  #phone-content { min-height:640px; max-height:800px; overflow-y:auto; }
  .cell { border:0.5px solid #D3D1C7; border-radius:14px; margin-bottom:10px; overflow:hidden; }
  .cell-head { padding:12px; display:flex; justify-content:space-between; align-items:center; cursor:pointer; }
  .cell-body { padding:0 12px 14px; border-top:0.5px solid #F1EFE8; }
  .chip { display:inline-block; padding:6px 12px; border-radius:20px; font-size:12px; margin:0 6px 6px 0; cursor:pointer; border:0.5px solid #D3D1C7; color:#5F5E5A; }
  .chip.sel { background:#1D5BFE; color:#fff; border-color:#1D5BFE; }
  .daydot { width:28px; height:28px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; cursor:pointer; border:0.5px solid #D3D1C7; color:#888780; }
  .daydot.sel { background:#1D5BFE; color:#fff; border-color:#1D5BFE; }
  .btn { border-radius:12px; height:42px; display:flex; align-items:center; justify-content:center; font-size:13px; font-weight:500; cursor:pointer; }
</style>
</head>
<body>
<div id="layout">
  <div id="sidebar">
    <h1>BENGS <span>Interactive app mockup — v2</span></h1>
    <div id="nav-list"></div>
  </div>
  <div id="main">
    <div id="screen-label"></div>
    <div id="phone-frame"><div id="phone-content"></div></div>
  </div>
</div>

<script>
const C = { blue:'#1D5BFE', amber:'#FAC829', red:'#FF383D', navy:'#0F1330', lavender:'#E7ECFF', gray:'#5F5E5A', line:'#D3D1C7', bg:'#F1EFE8' };
// Inline SVG icon set (stroke-based, 24x24 viewBox) — no external font dependency,
// so icons render even when this file is opened directly via file:// (webfont CORS
// on the .woff2 itself is a known failure mode for local-file HTML, the CSS loads
// fine but the font asset gets silently blocked).
const ICONS = {
  'chevron-left': '<path d="M15 6l-6 6 6 6"/>',
  'chevron-right': '<path d="M9 6l6 6-6 6"/>',
  'chevron-up': '<path d="M6 15l6-6 6 6"/>',
  'chevron-down': '<path d="M6 9l6 6 6-6"/>',
  'x': '<path d="M18 6L6 18M6 6l12 12"/>',
  'check': '<path d="M5 13l4 4L19 7"/>',
  'plus': '<path d="M12 5v14M5 12h14"/>',
  'camera': '<rect x="3" y="7" width="18" height="13" rx="2"/><circle cx="12" cy="13.5" r="3.2"/><path d="M8 7l1.3-2h5.4L16 7"/>',
  'edit': '<path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/>',
  'pencil': '<path d="M4 20h4L18.5 9.5a2.1 2.1 0 0 0-3-3L5 17v3Z"/>',
  'id': '<rect x="3" y="5" width="18" height="14" rx="2"/><circle cx="9" cy="12" r="2"/><path d="M14 10h4M14 14h4"/>',
  'license': '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M7 9h4M7 13h7M7 16.5h10"/>',
  'car': '<path d="M5 17h14M6 17a2 2 0 1 1-4 0M18 17a2 2 0 1 0 4 0M5 17V11l2-5h10l2 5v6"/>',
  'steering-wheel': '<circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="1.4"/><path d="M12 6.2v4.4M8.4 14.6L6.2 17M15.6 14.6l2.2 2.4"/>',
  'clock-hour-4': '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.5l3 2"/>',
  'clock': '<circle cx="12" cy="12" r="8.5"/><path d="M12 7.5v4.5l3 2"/>',
  'map-pin': '<path d="M12 21s7-6.7 7-11.3A7 7 0 1 0 5 9.7C5 14.3 12 21 12 21Z"/><circle cx="12" cy="9.7" r="2.3"/>',
  'lock': '<rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V7a4 4 0 1 1 8 0v4"/>',
  'cash': '<rect x="3" y="6" width="18" height="12" rx="2"/><circle cx="12" cy="12" r="3"/>',
  'notes': '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  'file-text': '<rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>',
  'repeat': '<path d="M17 2l4 4-4 4"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><path d="M7 22l-4-4 4-4"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/>',
  'ruler-2': '<rect x="3" y="8" width="18" height="8" rx="1"/><path d="M7 8v3M11 8v3M15 8v3"/>',
  'adjustments': '<path d="M4 6h16M4 12h16M4 18h16"/><circle cx="8" cy="6" r="1.6" fill="currentColor" stroke="none"/><circle cx="16" cy="12" r="1.6" fill="currentColor" stroke="none"/><circle cx="8" cy="18" r="1.6" fill="currentColor" stroke="none"/>',
  'star': '<path d="M12 2.5l3 6.6 7 .8-5.3 4.7 1.6 6.9-6.3-3.7-6.3 3.7 1.6-6.9-5.3-4.7 7-.8Z"/>',
  'arrow-left': '<path d="M19 12H5M11 6l-6 6 6 6"/>',
  'arrow-right': '<path d="M5 12h14M13 6l6 6-6 6"/>',
  'grip-vertical': '<circle cx="9" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="9" cy="18" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="6" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="15" cy="18" r="1" fill="currentColor" stroke="none"/>',
  'map-2': '<path d="M9 4.5l-6 2v13l6-2 6 2 6-2v-13l-6 2-6-2Z"/><path d="M9 4.5v13M15 6.5v13"/>',
  'mail': '<rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/>',
  'users': '<circle cx="9" cy="8" r="3"/><path d="M3.5 20a5.5 5.5 0 0 1 11 0"/><circle cx="17.5" cy="9.5" r="2.3"/><path d="M15.5 20a4.5 4.5 0 0 1 6-4.2"/>',
  'bolt': '<path d="M13 2 4 14h6l-1 8 9-12h-6l1-8Z"/>',
  'calendar': '<rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/>',
  'user': '<circle cx="12" cy="8" r="4"/><path d="M4 20a8 8 0 0 1 16 0"/>',
  'navigation': '<path d="M3 11l18-8-8 18-2-8-8-2Z"/>',
  'alert-triangle': '<path d="M12 3.2l9.5 16.8H2.5Z"/><path d="M12 9.5v4.5"/><circle cx="12" cy="17" r="0.9" fill="currentColor" stroke="none"/>',
  'circle-check': '<circle cx="12" cy="12" r="9"/><path d="M7.5 12.5l3 3 6-6.5"/>',
  'circle-x': '<circle cx="12" cy="12" r="9"/><path d="M9 9l6 6M15 9l-6 6"/>'
};
function ic(name, size, color){ size = size||16; color = color||'currentColor';
  var body = ICONS[name] || '<circle cx="12" cy="12" r="8"/>';
  return '<svg viewBox="0 0 24 24" width="' + size + '" height="' + size + '" fill="none" stroke="' + color + '" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:middle;display:inline-block">' + body + '</svg>'; }
function field(label, value, extra){ return '<div style="background:#fff;border-radius:14px;padding:12px;margin-bottom:10px;' + (extra||'') + '"><div style="font-size:11px;color:#5F5E5A;margin-bottom:4px">' + label + '</div><div style="font-size:13px;color:#0F1330;font-weight:500">' + value + '</div></div>'; }
function lockedField(label, value, iconName){ return '<div style="flex:1;background:' + C.lavender + ';border-radius:14px;padding:12px;opacity:0.9"><div style="display:flex;justify-content:space-between;align-items:center"><div style="font-size:10px;color:#534AB7">' + label + '</div>' + ic(iconName,11,'#534AB7') + '</div><div style="font-size:12px;color:#26215C;font-weight:500">' + value + '</div></div>'; }
function pill(text,bg,fg){ return '<span style="background:' + bg + ';color:' + fg + ';font-size:10px;padding:3px 8px;border-radius:20px">' + text + '</span>'; }
function mapSVG(h){ h=h||100; var y1=h-22, y2=Math.round(h*0.35), y3=Math.round(h*0.58), y4=Math.round(h*0.22), y5=Math.round(h*0.45);
  return '<svg viewBox="0 0 240 ' + h + '" style="width:100%;height:' + h + 'px;display:block"><rect width="240" height="' + h + '" fill="#EDEBE3"/><path d="M25 ' + y1 + ' L65 ' + y2 + ' L115 ' + y3 + ' L165 ' + y4 + ' L215 ' + y5 + '" stroke="#0F1330" stroke-width="2.5" fill="none"/><circle cx="25" cy="' + y1 + '" r="6" fill="' + C.red + '"/><circle cx="215" cy="' + y5 + '" r="6" fill="' + C.red + '"/></svg>'; }
function headerBar(title, opts){ opts=opts||{}; var c = opts.dark ? '#fff' : '#0F1330';
  return '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px 10px">' +
    '<span onclick="' + (opts.back?("go('"+opts.back+"')"):'') + '" style="color:' + c + ';font-size:16px;cursor:' + (opts.back?'pointer':'default') + '">' + (opts.hideBack?'':ic('chevron-left',18)) + '</span>' +
    '<span style="color:' + c + ';font-size:14px;font-weight:500">' + title + '</span>' +
    '<span style="width:18px;color:' + c + '">' + (opts.right||'') + '</span></div>'; }
function bottomNav(active){ var tabs=[['schedule','calendar','Schedule','NAV-S02'],['friends','users','Friends','SOC-S06'],['','bolt','Home','NAV-S03'],['inbox','mail','Inbox','NOTIF-S01'],['profile','user','Profile','PROF-S01']];
  var out = '<div style="background:#fff;border-top:0.5px solid #F1EFE8;padding:10px 16px 14px;display:flex;justify-content:space-between;align-items:flex-end">';
  tabs.forEach(function(t){
    if(t[0]===''){ out += '<div onclick="go(\'' + t[3] + '\')" style="text-align:center;color:#412402;font-size:9px;margin-top:-24px;cursor:pointer"><div style="width:46px;height:46px;border-radius:50%;background:' + C.amber + ';display:flex;align-items:center;justify-content:center;font-size:20px;box-shadow:0 2px 6px rgba(0,0,0,0.15)">' + ic('bolt',20) + '</div>' + t[2] + '</div>'; }
    else { out += '<div onclick="go(\'' + t[3] + '\')" style="text-align:center;color:' + (active===t[0]?'#0F1330':'#888780') + ';font-size:9px;cursor:pointer;position:relative">' + (t[0]==='inbox'?('<span style="position:absolute;top:-2px;right:6px;width:6px;height:6px;background:'+C.red+';border-radius:50%"></span>'):'') + '<div style="font-size:18px">' + ic(t[1],18) + '</div>' + t[2] + '</div>'; }
  });
  return out + '</div>'; }
function scanScreen(title, docIcon, hint, nextId){ return '<div style="background:' + C.navy + ';padding:20px;min-height:600px">' + headerBar(title,{dark:true,hideBack:true,right:ic('x',16)}) +
  '<div style="border:2px dashed rgba(255,255,255,0.4);border-radius:12px;height:160px;display:flex;align-items:center;justify-content:center;margin:8px 0 16px;position:relative">' + ic(docIcon,40,'rgba(255,255,255,0.3)') + '<div style="position:absolute;bottom:8px;left:0;right:0;text-align:center;color:rgba(255,255,255,0.5);font-size:10px">' + hint + '</div></div>' +
  '<div onclick="go(\'' + nextId + '\')" style="width:56px;height:56px;border-radius:50%;background:#fff;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;cursor:pointer">' + ic('camera',24,C.navy) + '</div>' +
  '<div style="text-align:center;color:rgba(255,255,255,0.5);font-size:10px">Tap the shutter to continue</div></div>'; }
function confirmScreen(title, rows, nextId){ var rowsHtml = rows.map(function(r){ return '<div><div style="font-size:10px;color:#5F5E5A">' + r[0] + '</div><div style="border-bottom:0.5px solid #D3D1C7;padding:6px 0;font-size:13px;color:#0F1330">' + r[1] + '</div></div>'; }).join('');
  return '<div style="background:#fff;padding:20px;min-height:600px">' + headerBar(title,{}) +
  '<div style="background:#EAF3DE;border-radius:10px;padding:8px 10px;display:flex;align-items:center;gap:6px;margin-bottom:14px">' + ic('check',13,'#27500A') + '<span style="font-size:11px;color:#27500A">Scanned successfully — check the details below</span></div>' +
  '<div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">' + rowsHtml + '</div>' +
  '<div style="font-size:10px;color:#888780;margin-bottom:14px;display:flex;align-items:center;gap:5px">' + ic('edit',12) + 'Every field above is editable</div>' +
  '<div class="btn" onclick="go(\'' + nextId + '\')" style="background:' + C.blue + ';color:#fff">Continue</div></div>'; }
function selfieScreen(title, hint, nextId){ return '<div style="background:' + C.navy + ';padding:20px;min-height:600px">' + headerBar(title,{dark:true,hideBack:true,right:ic('x',16)}) +
  '<div style="border-radius:50%;width:150px;height:150px;margin:8px auto 14px;border:2px dashed rgba(255,255,255,0.5);display:flex;align-items:center;justify-content:center">' + ic('user',44,'rgba(255,255,255,0.3)') + '</div>' +
  '<div style="background:rgba(255,255,255,0.1);border-radius:8px;padding:8px;display:flex;align-items:center;gap:6px;margin-bottom:16px">' + ic('id',14,'rgba(255,255,255,0.7)') + '<span style="font-size:10px;color:rgba(255,255,255,0.7)">' + hint + '</span></div>' +
  '<div onclick="go(\'' + nextId + '\')" style="width:56px;height:56px;border-radius:50%;background:#fff;margin:0 auto;display:flex;align-items:center;justify-content:center;cursor:pointer">' + ic('camera',24,C.navy) + '</div></div>'; }
function chipRow(labels, selIdx){ return labels.map(function(l,i){ return '<div class="chip ' + (i===selIdx?'sel':'') + '">' + l + '</div>'; }).join(''); }
function sliderRow(label,val,min,max,cur){ return '<div style="margin-bottom:16px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:4px"><span>' + label + '</span><span style="color:#5F5E5A">' + val + '</span></div><input type="range" min="' + min + '" max="' + max + '" value="' + cur + '" style="width:100%;accent-color:' + C.blue + ';height:18px"></div>'; }
function notifRow(title,sub){ return '<div style="border-bottom:0.5px solid #F1EFE8;padding:10px 0"><div style="font-size:13px;font-weight:500">' + title + '</div><div style="font-size:11px;color:#5F5E5A">' + sub + '</div></div>'; }
function enrichRow(label,val,vis){ return '<div style="background:#fff;border:0.5px solid #D3D1C7;border-radius:12px;padding:10px 12px;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center"><div><div style="font-size:11px;color:#5F5E5A">' + label + '</div><div style="font-size:13px">' + val + '</div></div><div onclick="go(\'PROF-S04\')" style="cursor:pointer">' + pill(vis==='public'?'Public':'Cool friends','#EEEDFE','#26215C') + '</div></div>'; }

// ---------------- STATE ----------------
var state = {
  current: 'AUTH-S01',
  addBeng: { open:null, vehicle:0, title:"Emmie's 4th Beng!", origin:'Senayan Residence', destination:'SCBD Lot 17', price:15000, seats:5, distance:12.4, arrivalTime:'08:15', arrivalTimeMin:'08:15', desc:'', freq:'never', days:[], everyN:1 },
  cardStack: { idx:0, requested:false },
  reqConfirm: { overlap:false }
};

function mount(){ document.getElementById('phone-content').innerHTML = SCREENS[state.current].render();
  var s=SCREENS[state.current]; document.getElementById('screen-label').innerHTML = '<b>' + s.id + '</b> — ' + s.title;
  document.querySelectorAll('.nav-item').forEach(function(el){ el.classList.toggle('active', el.dataset.id===state.current); }); }
function go(id){ if(!SCREENS[id]){ console.warn('missing', id); return; } state.current=id; mount(); }
function toggleCell(name){ state.addBeng.open = state.addBeng.open===name ? null : name; mount(); }
function pickFreq(f){ state.addBeng.freq=f; mount(); }
function toggleDay(d){ var i=state.addBeng.days.indexOf(d); if(i>-1) state.addBeng.days.splice(i,1); else state.addBeng.days.push(d); mount(); }
function pickVehicle(i){ state.addBeng.vehicle=i; mount(); }
function skipCard(){ state.cardStack.idx = (state.cardStack.idx+1)%3; state.cardStack.requested=false; mount(); }
function toggleRequest(){ state.cardStack.requested = !state.cardStack.requested; mount(); }
function toggleOverlapDemo(){ state.reqConfirm.overlap = !state.reqConfirm.overlap; mount(); }

// ---------------- SCREENS ----------------
var SCREENS = {};
function reg(id, group, title, render){ SCREENS[id] = {id:id, group:group, title:title, render:render}; }

// === 1. AUTH & ONBOARDING ===
reg('AUTH-S01','Auth & Onboarding','Splash', function(){ return '<div style="background:' + C.blue + ';min-height:600px;display:flex;flex-direction:column;align-items:center;justify-content:center">' +
  '<div style="width:56px;height:56px;border:4px solid #fff;border-top-color:' + C.amber + ';border-radius:50%;margin-bottom:10px"></div>' +
  '<div style="color:#fff;font-size:26px;font-weight:600;letter-spacing:1px;margin-bottom:40px">BENGS</div>' +
  '<div onclick="go(\'AUTH-S02\')" style="position:absolute;bottom:24px;color:rgba(255,255,255,0.5);font-size:10px;cursor:pointer">tap to continue →</div></div>'; });

reg('AUTH-S02','Auth & Onboarding','Onboarding Intro', function(){ return '<div style="background:' + C.blue + ';min-height:600px;padding:32px 24px;text-align:center;display:flex;flex-direction:column;justify-content:center">' +
  '<div style="width:44px;height:44px;border:3px solid #fff;border-top-color:' + C.amber + ';border-radius:50%;margin:0 auto 10px"></div>' +
  '<div style="color:#fff;font-size:20px;font-weight:600;margin-bottom:20px">BENGS</div>' +
  '<div style="color:' + C.amber + ';font-weight:700;font-size:15px;margin-bottom:8px">Explore now<br>to experience the benefits</div>' +
  '<div style="color:#fff;font-size:12px;line-height:1.6;margin-bottom:24px">Nebeng with people you already trust, on your schedule or the spot.</div>' +
  '<div class="btn" onclick="go(\'AUTH-S03\')" style="background:' + C.amber + ';color:#412402">Get Started</div></div>'; });

reg('AUTH-S03','Auth & Onboarding','Log In / Sign Up Choice — FIXED (no Facebook)', function(){ return '<div style="background:' + C.blue + ';min-height:600px;padding:28px 20px">' +
  '<div style="text-align:center;margin-bottom:36px"><div style="width:40px;height:40px;border:3px solid #fff;border-top-color:' + C.amber + ';border-radius:50%;margin:0 auto 6px"></div><div style="color:#fff;font-size:20px;font-weight:600;letter-spacing:1px">BENGS</div></div>' +
  '<div class="btn" onclick="go(\'AUTH-S04\')" style="background:' + C.amber + ';color:#412402;margin-bottom:12px">Log In</div>' +
  '<div class="btn" onclick="go(\'AUTH-S08\')" style="background:' + C.navy + ';color:#FAC829;margin-bottom:20px">Sign Up</div>' +
  '<div style="display:flex;align-items:center;gap:8px;margin-bottom:20px"><div style="flex:1;height:1px;background:rgba(255,255,255,0.4)"></div><div style="color:#fff;font-size:12px">Or</div><div style="flex:1;height:1px;background:rgba(255,255,255,0.4)"></div></div>' +
  '<div class="btn" style="background:' + C.navy + ';color:#fff;gap:8px"><span style="color:#EF9F27;font-weight:700">G</span> Continue with Google</div>' +
  '<div style="text-align:center;margin-top:12px;font-size:10px;color:rgba(255,255,255,0.55)">Facebook removed per BR-08 — this screen was missing from the first fix pass</div></div>'; });

reg('AUTH-S04','Auth & Onboarding','Log In (fixed)', function(){ return '<div style="background:' + C.blue + ';min-height:600px;padding:28px 20px">' + headerBar('Log in',{dark:true,back:'AUTH-S03'}) +
  '<div style="text-align:center;margin:12px 0 20px"><div style="width:40px;height:40px;border:3px solid #fff;border-top-color:' + C.amber + ';border-radius:50%;margin:0 auto 6px"></div><div style="color:#fff;font-size:20px;font-weight:600;letter-spacing:1px">BENGS</div></div>' +
  field('Email or phone','you@email.com') + field('Password','••••••••') +

function cell(name, iconName, label, summary, bodyHtml){ var open = state.addBeng.open===name;
  return '<div class="cell"><div class="cell-head" onclick="toggleCell(\'' + name + '\')">' +
    '<div style="display:flex;align-items:center;gap:8px">' + ic(iconName,16,'#5F5E5A') + '<div><div style="font-size:11px;color:#5F5E5A">' + label + '</div><div style="font-size:13px;font-weight:500;color:#0F1330">' + summary + '</div></div></div>' +
    ic(open?'chevron-up':'chevron-down',16,'#888780') + '</div>' +
    (open ? ('<div class="cell-body">' + bodyHtml + '</div>') : '') + '</div>'; }

function repeatBody(b){
  var extra = '';
  if(b.freq==='weekly'){
    var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
    extra = '<div style="font-size:11px;color:#5F5E5A;margin:10px 0 6px">On these days</div><div style="display:flex;gap:6px">' + days.map(function(d){ return '<div class="daydot ' + (b.days.indexOf(d)>-1?'sel':'') + '" onclick="toggleDay(\'' + d + '\')">' + d[0] + '</div>'; }).join('') + '</div>';
  } else if(b.freq==='monthly'){
    extra = '<div style="font-size:11px;color:#5F5E5A;margin:10px 0 6px">Each</div><div style="font-size:12px">Date 20 of every month</div>';
  } else if(b.freq==='yearly'){
    extra = '<div style="font-size:11px;color:#5F5E5A;margin:10px 0 6px">Months</div><div style="display:flex;flex-wrap:wrap">' + chipRow(['Jan','Jun','Dec'],-1) + '</div>';
  } else if(b.freq==='daily'){
    extra = '<div style="font-size:11px;color:#5F5E5A;margin-top:10px">Repeats every day, no further options.</div>';
  }
  var freqs=['never','daily','weekly','monthly','yearly'];
  var chips = freqs.map(function(f){ return '<div class="chip ' + (b.freq===f?'sel':'') + '" onclick="pickFreq(\'' + f + '\')">' + (f.charAt(0).toUpperCase()+f.slice(1)) + '</div>'; }).join('');
  return '<div style="margin-top:8px;display:flex;flex-wrap:wrap;gap:6px">' + chips + '</div>' + extra;
}

// Shared field-order per bengs_User_Flow-3.pdf §2/§3: Title -> Vehicle -> Location
// (origin+destination, single map ABOVE the accordion, not duplicated inside a cell) ->
// Max distance (gated on vehicle+locations) -> Price -> Passengers -> Description ->
// Departure -> Max ETA (gated on departure too) -> Repeat (scheduled only, omitted for quick).
// mode: 'scheduled' | 'quick'. Quick locks Origin to current location and Departure to "Now",
// and drops the Repeat cell entirely rather than showing it disabled.
function bengForm(mode){
  var b = state.addBeng;
  var isQuick = mode === 'quick';
  var vehicles = ['Avanza pagi · B 1234 ABC','Vario malam · B 5678 XYZ'];
  var vehicleBody = vehicles.map(function(v,i){ return '<div onclick="pickVehicle(' + i + ')" style="padding:8px 0;border-top:0.5px solid #F1EFE8;font-size:13px;display:flex;justify-content:space-between;cursor:pointer"><span>' + v + '</span>' + (b.vehicle===i?ic('check',14,C.blue):'') + '</div>'; }).join('') + '<div style="padding-top:8px;font-size:11px;color:#185FA5;cursor:pointer" onclick="go(\'VEH-S02\')">+ Add new vehicle</div>';

  var locationBody = isQuick ?
    ('<div style="display:flex;align-items:center;gap:6px;margin-top:8px;background:' + C.lavender + ';border-radius:8px;padding:8px"><span style="color:#534AB7">' + ic('lock',12) + '</span><span style="font-size:12px;color:#26215C">Origin locked to current location</span></div>' +
     '<input value="' + b.destination + '" oninput="state.addBeng.destination=this.value" placeholder="Destination" style="width:100%;border:0.5px solid #D3D1C7;border-radius:8px;padding:8px;font-size:13px;margin-top:8px">') :
    ('<input value="' + b.origin + '" oninput="state.addBeng.origin=this.value" placeholder="Origin" style="width:100%;border:0.5px solid #D3D1C7;border-radius:8px;padding:8px;font-size:13px;margin-top:8px;margin-bottom:6px">' +
     '<input value="' + b.destination + '" oninput="state.addBeng.destination=this.value" placeholder="Destination" style="width:100%;border:0.5px solid #D3D1C7;border-radius:8px;padding:8px;font-size:13px">');
  var locationSummary = (isQuick ? 'Current location' : b.origin) + ' → ' + b.destination;

  var locationsFilled = b.origin && b.destination; // gates max distance
  var departureFilled = isQuick ? true : true; // demo state: departure always considered set once reached in flow
  var distanceGated = !locationsFilled;
  var etaGated = !locationsFilled || !departureFilled;

  var distanceBody = distanceGated ?
    ('<div style="font-size:11px;color:#888780;margin-top:8px">Fill in vehicle, origin, and destination first — this pre-fills from ORS as a lowerbound. Editable, but never below that floor.</div>') :
    ('<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span style="font-size:12px">Max distance</span><input value="' + b.distance + '" oninput="state.addBeng.distance=Math.max(Number(this.value)||0, 12.4)" style="width:80px;text-align:right;border:0.5px solid #D3D1C7;border-radius:6px;padding:4px 6px;font-size:13px;font-weight:500;color:#185FA5"> km</div>' +
     '<div style="font-size:10px;color:#888780;margin-top:4px">ORS lowerbound: 12.4 km — this field can only go up from there</div>');

  var departureBody = isQuick ?
    ('<div style="display:flex;align-items:center;gap:6px;margin-top:8px;background:' + C.lavender + ';border-radius:8px;padding:8px"><span style="color:#534AB7">' + ic('lock',12) + '</span><span style="font-size:12px;color:#26215C">Fixed to now for quick beng — no picker</span></div>') :
    ('<div style="margin-top:8px;font-size:12px">Date: Today · Time: 07:00 · Timezone: Jakarta</div>');

  var etaBody = etaGated ?
    ('<div style="font-size:11px;color:#888780;margin-top:8px">Fill in departure first — this pre-fills from ORS as a lowerbound. Editable, but never earlier than that floor.</div>') :
    ('<div style="display:flex;justify-content:space-between;align-items:center;margin-top:8px"><span style="font-size:12px">Latest arrival</span><input value="' + b.arrivalTime + '" oninput="state.addBeng.arrivalTime=this.value" style="width:80px;text-align:right;border:0.5px solid #D3D1C7;border-radius:6px;padding:4px 6px;font-size:13px;font-weight:500;color:#185FA5"></div>' +

    cell('eta','clock-hour-4','Latest arrival', etaGated ? 'Locked' : ('by ' + b.arrivalTime), etaBody) +

  return '<div style="background:' + C.blue + ';min-height:600px;padding:16px">' +

// ---------------- SIDEBAR + INIT ----------------
function buildSidebar(){
  var groups = {};
  var order = [];
  Object.keys(SCREENS).forEach(function(k){ var s=SCREENS[k]; if(!groups[s.group]){ groups[s.group]=[]; order.push(s.group); } groups[s.group].push(s); });
  var html='';
  order.forEach(function(g){ html += '<div class="group-label">' + g + '</div>';
    groups[g].forEach(function(s){ html += '<div class="nav-item" data-id="' + s.id + '" onclick="go(\'' + s.id + '\')">' + s.id + ' — ' + s.title + '</div>'; }); });
  document.getElementById('nav-list').innerHTML = html;
}
